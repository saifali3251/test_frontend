services:
  frontend:
    build: .
    environment:
      # Points at a backend running standalone (test_backend's own compose,
      # published on BACKEND_PORT). host.docker.internal works on Docker
      # Desktop automatically; on plain Docker Engine (Linux) it needs
      # `--add-host=host.docker.internal:host-gateway` — add that here if
      # you hit this standalone on a Linux box.
      BACKEND_URL: ${BACKEND_URL:-http://host.docker.internal:18000}
    ports:
      - "${FRONTEND_PORT:-13000}:80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
